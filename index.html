<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#ff6b6b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fotomatón Tatiana">
  <title>Fotomatón - 15 años Tatiana</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', 'Arial', sans-serif;
      background: linear-gradient(135deg, #ffe6f0, #fff0e6);
      min-height: 100vh;
      padding: 20px;
    }

    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

    .container {
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      color: #c44569;
      margin: 20px 0;
      font-family: 'Great Vibes', cursive;
    }

    .camara-preview {
      width: 100%;
      height: 400px;
      background: #000;
      border-radius: 30px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
    }

    video, #fotoPreview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn {
      display: inline-block;
      padding: 16px 32px;
      background: linear-gradient(135deg, #ff6b6b, #c44569);
      color: white;
      border-radius: 60px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      margin: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #6c5ce7, #a363d9);
    }

    .btn-success {
      background: linear-gradient(135deg, #25D366, #128C7E);
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .galeria-mini {
      margin-top: 30px;
      background: white;
      border-radius: 30px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .galeria-mini h3 {
      color: #c44569;
      margin-bottom: 15px;
    }

    .fotos-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-height: 200px;
      overflow-y: auto;
    }

    .foto-mini {
      width: 80px;
      height: 80px;
      border-radius: 15px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .mensaje {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f6e8c;
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: bold;
      z-index: 1000;
      animation: fadeOut 2s ease forwards;
    }

    @keyframes fadeOut {
      0% { opacity: 1; transform: translateX(-50%) translateY(0); }
      70% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); visibility: hidden; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .instrucciones {
      background: rgba(255,255,255,0.9);
      border-radius: 20px;
      padding: 15px;
      margin: 20px 0;
      font-size: 0.9rem;
      color: #5a5a5a;
    }

    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid white;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <h1>📸 Fotomatón<br>15 años Tatiana</h1>
    
    <div class="camara-preview">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" style="display: none;"></canvas>
      <img id="fotoPreview" style="display: none;">
    </div>

    <div>
      <button id="tomarFotoBtn" class="btn">
        <i class="fas fa-camera"></i> Tomar foto
      </button>
      <button id="reintentarBtn" class="btn btn-secondary" style="display: none;">
        <i class="fas fa-redo"></i> Otra foto
      </button>
      <button id="enviarBtn" class="btn btn-success" style="display: none;">
        <i class="fab fa-whatsapp"></i> Enviar a Tatiana
      </button>
    </div>

    <div class="instrucciones">
      <i class="fas fa-info-circle"></i> Toca "Tomar foto" para sacarte una selfie. Luego envíala por WhatsApp a Tatiana. ¡Todas las fotos llegarán directo a su celular!
    </div>

    <div class="galeria-mini" id="galeriaMini" style="display: none;">
      <h3>📸 Tus fotos</h3>
      <div id="fotosLista" class="fotos-preview"></div>
      <button id="enviarTodasBtn" class="btn btn-success" style="margin-top: 15px; padding: 10px 20px; font-size: 0.9rem;">
        <i class="fab fa-whatsapp"></i> Enviar todas las fotos
      </button>
    </div>
  </div>

  <script>
    // Configuración
    const WHATSAPP_NUMBER = "598096545705"; // Tu número
    let stream = null;
    let fotoActual = null;
    let todasLasFotos = [];
    
    // Elementos
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const fotoPreview = document.getElementById('fotoPreview');
    const tomarFotoBtn = document.getElementById('tomarFotoBtn');
    const reintentarBtn = document.getElementById('reintentarBtn');
    const enviarBtn = document.getElementById('enviarBtn');
    const galeriaMini = document.getElementById('galeriaMini');
    const fotosLista = document.getElementById('fotosLista');
    const enviarTodasBtn = document.getElementById('enviarTodasBtn');
    
    // Cargar fotos guardadas
    function cargarFotosGuardadas() {
      const guardadas = localStorage.getItem('fotosFotomatic');
      if (guardadas) {
        todasLasFotos = JSON.parse(guardadas);
        if (todasLasFotos.length > 0) {
          mostrarGaleriaMini();
        }
      }
    }
    
    function guardarFotos() {
      localStorage.setItem('fotosFotomatic', JSON.stringify(todasLasFotos));
      mostrarGaleriaMini();
    }
    
    function mostrarGaleriaMini() {
      if (todasLasFotos.length === 0) {
        galeriaMini.style.display = 'none';
        return;
      }
      
      galeriaMini.style.display = 'block';
      fotosLista.innerHTML = todasLasFotos.map((foto, index) => `
        <div style="position: relative;">
          <img src="${foto.data}" class="foto-mini">
          <button onclick="eliminarFoto(${index})" style="position: absolute; top: -5px; right: -5px; background: #ff6b6b; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer;">✕</button>
        </div>
      `).join('');
    }
    
    window.eliminarFoto = function(index) {
      todasLasFotos.splice(index, 1);
      guardarFotos();
      if (todasLasFotos.length === 0) {
        galeriaMini.style.display = 'none';
      }
      mostrarMensaje('📸 Foto eliminada');
    };
    
    function mostrarMensaje(texto) {
      const msg = document.createElement('div');
      msg.className = 'mensaje';
      msg.innerHTML = texto;
      document.body.appendChild(msg);
      setTimeout(() => msg.remove(), 2000);
    }
    
    // Iniciar cámara
    async function iniciarCamara() {
      try {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user" }, // selfie
          audio: false 
        });
        video.srcObject = stream;
        video.style.display = 'block';
        fotoPreview.style.display = 'none';
        reintentarBtn.style.display = 'none';
        enviarBtn.style.display = 'none';
        tomarFotoBtn.style.display = 'inline-block';
      } catch (err) {
        console.error('Error al acceder a la cámara:', err);
        mostrarMensaje('❌ No se pudo acceder a la cámara. Asegúrate de dar permisos.');
      }
    }
    
    // Tomar foto
    tomarFotoBtn.addEventListener('click', () => {
      const context = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      fotoActual = canvas.toDataURL('image/jpeg', 0.9);
      fotoPreview.src = fotoActual;
      
      video.style.display = 'none';
      fotoPreview.style.display = 'block';
      tomarFotoBtn.style.display = 'none';
      reintentarBtn.style.display = 'inline-block';
      enviarBtn.style.display = 'inline-block';
    });
    
    // Reintentar
    reintentarBtn.addEventListener('click', () => {
      video.style.display = 'block';
      fotoPreview.style.display = 'none';
      tomarFotoBtn.style.display = 'inline-block';
      reintentarBtn.style.display = 'none';
      enviarBtn.style.display = 'none';
      fotoActual = null;
    });
    
    // Enviar foto actual
    enviarBtn.addEventListener('click', () => {
      if (fotoActual) {
        // Guardar en galería local
        todasLasFotos.unshift({ data: fotoActual, fecha: new Date().toISOString() });
        guardarFotos();
        
        // Enviar por WhatsApp
        const mensaje = `📸 *Fotomatón 15 años Tatiana* 🦋\n\n¡Un invitado te dejó un recuerdo! 🎉\n\n*Foto:*`;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`, '_blank');
        
        mostrarMensaje('✨ ¡Foto guardada! Abre WhatsApp para enviarla ✨');
        
        // Resetear
        video.style.display = 'block';
        fotoPreview.style.display = 'none';
        tomarFotoBtn.style.display = 'inline-block';
        reintentarBtn.style.display = 'none';
        enviarBtn.style.display = 'none';
        fotoActual = null;
      }
    });
    
    // Enviar todas las fotos
    enviarTodasBtn.addEventListener('click', () => {
      if (todasLasFotos.length === 0) {
        mostrarMensaje('📸 No hay fotos para enviar');
        return;
      }
      
      const mensaje = `📸 *Fotomatón 15 años Tatiana* 🦋\n\n¡Mirá los recuerdos! Total: ${todasLasFotos.length} fotos tomadas.\n\n✨ ¡Gracias por compartir! ✨`;
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`, '_blank');
      mostrarMensaje('✨ Abre WhatsApp para enviar todas las fotos ✨');
    });
    
    // Iniciar
    iniciarCamara();
    cargarFotosGuardadas();
    
    // Al cerrar la página, liberar cámara
    window.addEventListener('beforeunload', () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });
  </script>
</body>
</html>
